<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ICS Mentor · Integrationstest V1</title>
<style>*{box-sizing:border-box}body{margin:0;background:#1a1815;color:#f6f1e7;font-family:Arial,sans-serif}header{padding:22px 16px;text-align:center;border-bottom:1px solid #6c5433}header small{letter-spacing:.16em;color:#d4a03a}h1{font:normal 30px Georgia,serif;margin:12px 0;color:#f6f1e7}p{line-height:1.5}header p{max-width:660px;margin:8px auto;color:#c9beab;font-size:14px}.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:15px}button{border:1px solid #8b6a38;border-radius:9px;padding:12px 20px;background:transparent;color:#f6f1e7;cursor:pointer;font-weight:bold}button[aria-selected=true]{background:#d4a03a;color:#1a1815}.note{max-width:790px;margin:0 auto 12px;padding:12px 18px;background:#29231a;border:1px solid #6c5433;border-radius:9px;font-size:13px;color:#d8cbb5}.panels{max-width:980px;margin:auto;padding:0 10px 24px}section[hidden]{display:none}iframe{width:100%;height:78vh;min-height:650px;border:1px solid #6c5433;border-radius:12px;background:#0b0a08}@media(max-width:650px){h1{font-size:24px}iframe{height:77vh;min-height:580px}}</style></head>
<body><header><small>INNER CODE SYSTEMS · ISOLIERTER INTEGRATIONSTEST</small><h1>Dein persönlicher ICS Mentor</h1><p>Ein Einstieg für dein Gespräch und deine persönliche Klarheit.</p></header>
<nav class="tabs" aria-label="Mentor-Funktionen"><button id="tab-mentor" aria-selected="true" aria-controls="panel-mentor">Mit dem Mentor sprechen</button><button id="tab-clarity" aria-selected="false" aria-controls="panel-clarity">Klarheit gewinnen</button></nav>
<div class="note" id="status" role="status">Der bestehende ICS Mentor läuft hier unverändert in einer eingebetteten Ansicht. Die Klarheitsfunktion wird separat zugeschaltet.</div>
<main class="panels"><section id="panel-mentor"><iframe title="Bestehender ICS Digital Mentor" src="https://innercodesystems.github.io/ics-auswertungstool/ics-mentor/" loading="eager"></iframe></section><section id="panel-clarity" hidden><iframe id="clarity-frame" title="ICS Klarheits-Kompass V1.9" data-src="https://www.innercodesystems.com/ki-lab-v19.html" loading="lazy"></iframe></section></main>
<script>(()=>{const m=document.getElementById('tab-mentor'),c=document.getElementById('tab-clarity'),pm=document.getElementById('panel-mentor'),pc=document.getElementById('panel-clarity'),f=document.getElementById('clarity-frame'),s=document.getElementById('status');function choose(clarity){m.setAttribute('aria-selected',String(!clarity));c.setAttribute('aria-selected',String(clarity));pm.hidden=clarity;pc.hidden=!clarity;if(clarity&&!f.src)f.src=f.dataset.src;s.textContent=clarity?'Klarheits-Kompass V1.9: Erkenntnisse können nur in dessen isoliertem Testbrowser gespeichert werden. Noch kein gemeinsamer Mentor-Verlauf.':'Bestehender ICS Mentor: Die bisherige Gesprächslogik bleibt unverändert. Noch keine automatische Übergabe aus dem Klarheits-Kompass.';}m.addEventListener('click',()=>choose(false));c.addEventListener('click',()=>choose(true));})();</script></body></html>
