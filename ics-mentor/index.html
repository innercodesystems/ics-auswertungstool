<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ICS Digital Mentor</title>

  <link rel="stylesheet" href="css/mentor.css">
</head>

<body>

  <main class="mentor-page">

    <section class="mentor-header">
      <p class="mentor-label">INNER CODE SYSTEMS</p>

      <h1>ICS Digital Mentor</h1>

      <p class="mentor-intro">
        Ein geschützter Raum für Klarheit, Wahrnehmung und deinen nächsten Schritt.
      </p>
    </section>

    <section class="mentor-card">

      <div class="mentor-status">
        <span class="mentor-dot"></span>
        Mentor ist bereit
      </div>

      <div class="mentor-chat">
        <div class="mentor-message">
          <strong>🧠 ICS Mentor</strong>

          <p>
            Willkommen. Was beschäftigt dich im Moment am meisten?
          </p>
        </div>
      </div>

      <div class="mentor-input-area">
        <textarea
          placeholder="Schreibe hier, was dich gerade beschäftigt..."
          rows="4"
        ></textarea>

        <button type="button">
          Nachricht senden
        </button>
      </div>

    </section>

  </main>

</body>
</html>
