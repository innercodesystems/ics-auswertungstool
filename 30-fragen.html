<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>30 Fragen an dich – INNER CODE SYSTEMS</title>
<style>
:root{--bg:#1a1815;--card:#24211d;--gold:#b8924f;--cream:#f6f1e7;--muted:#bdb5a8;--line:#403a31}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}button,textarea{font:inherit}.wrap{max-width:760px;margin:auto;padding:28px 18px 60px}.brand{font-size:12px;letter-spacing:.24em;color:var(--gold);text-align:center;margin-bottom:26px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 12px 40px #0004}.center{text-align:center}h1{font-size:clamp(36px,8vw,64px);line-height:1.02;margin:10px 0 14px}h2{font-size:clamp(27px,6vw,42px);line-height:1.12;margin:12px 0}p{line-height:1.65;color:#ded8cd}.gold{color:var(--gold)}.btn{width:100%;border:0;border-radius:13px;padding:16px 18px;margin-top:16px;background:var(--gold);color:#181510;font-weight:800;cursor:pointer}.btn.secondary{background:transparent;color:var(--cream);border:1px solid var(--line)}.btn:disabled{opacity:.35;cursor:not-allowed}.progress{height:5px;background:#39342c;border-radius:9px;overflow:hidden;margin:12px 0 28px}.progress>div{height:100%;background:var(--gold)}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}.q{font-size:clamp(27px,6vw,40px);line-height:1.2;margin:28px 0}.hint{color:var(--muted);font-size:14px}textarea{width:100%;min-height:150px;background:#181613;border:1px solid var(--line);border-radius:14px;padding:15px;color:var(--cream);resize:vertical;outline:none}textarea:focus{border-color:var(--gold)}.rating{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}.rate{padding:13px 0;border-radius:11px;border:1px solid var(--line);background:#181613;color:var(--cream)}.rate.on{border-color:var(--gold);background:var(--gold);color:#181510;font-weight:800}.heart{display:flex;gap:9px;align-items:center;margin:18px 0;color:var(--muted);cursor:pointer}.heart.on{color:var(--gold)}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}.worlds{display:grid;gap:12px;margin-top:20px}.barrow{display:grid;grid-template-columns:115px 1fr 46px;gap:10px;align-items:center}.bar{height:9px;background:#39342c;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}.resultbox{border-top:1px solid var(--line);margin-top:24px;padding-top:20px}.path{padding:16px 0;border-bottom:1px solid var(--line)}.small{font-size:12px;color:var(--muted)}@media(max-width:520px){.card{padding:22px 18px}.barrow{grid-template-columns:minmax(125px,auto) 1fr 42px;gap:8px}.barrow b{font-size:15px;white-space:nowrap;letter-spacing:-.02em}.barrow span{text-align:right}.worlds{gap:14px}}
</style>
</head>
<body><main class="wrap"><div class="brand">INNER CODE SYSTEMS</div><div id="app"></div></main>
<script>
const worlds=['INNER','BODY','ACTION','RESET','ORIENTIERUNG'];
const qs=[
['INNER','Verantwortung','Wo in deinem Leben funktionierst du gerade mehr, als dass du wirklich lebst?','Modus-Kompass'],
['INNER','Verantwortung','Was weißt du eigentlich längst – möchtest es dir aber noch nicht vollständig eingestehen?','Glaubenssatz-Kompass'],
['INNER','Standards','Wo sagst du Ja, obwohl etwas in dir Nein sagt?','Werte-Kompass'],
['INNER','Verantwortung','Welcher Gedanke begleitet dich immer wieder, obwohl er dich nicht weiterbringt?','Glaubenssatz-Kompass'],
['INNER','Standards','Was hältst du fest, obwohl du spürst, dass es Kraft kostet?','RESET'],
['INNER','Vision','Wenn du niemandem etwas beweisen müsstest – was würdest du in deinem Leben anders machen?','Werte-Kompass'],
['BODY','Verantwortung','Wo in deinem Körper spürst du gerade am deutlichsten, wie es dir wirklich geht?','Körper-Signale'],
['BODY','Standards','Bei welchen Menschen oder Situationen wird dein Körper weit – und bei welchen eng?','Was nährt dich?'],
['BODY','Standards','Was kostet dich regelmäßig Energie?','Was nährt dich?'],
['BODY','Vision','Was nährt dich wirklich?','Was nährt dich?'],
['BODY','Verantwortung','Welches Signal deines Körpers übergehst du immer wieder?','Körper-Signale'],
['BODY','Vision','Wenn dein Kopf für einen Moment still wäre: Was würde dein Körper heute wählen?','BODY'],
['ACTION','Disziplin','Welche Entscheidung schiebst du schon länger vor dir her?','Entscheidungs-Kompass'],
['ACTION','Verantwortung','Was würdest du tun, wenn du keine Angst vor der Reaktion anderer hättest?','Entscheidungs-Kompass'],
['ACTION','Verantwortung','Wo wartest du noch darauf, dass jemand anderes dir die Erlaubnis gibt?','Glaubenssatz-Kompass'],
['ACTION','Disziplin','Welche eine kleine Handlung würde heute bereits einen Unterschied machen?','Action Code Kickstart'],
['ACTION','Disziplin','Was beginnst du immer wieder – ziehst es aber nicht konsequent durch?','Action Code Kickstart'],
['ACTION','Standards','Welchen neuen Standard möchtest du ab heute für dich setzen?','Werte-Kompass'],
['RESET','Verantwortung','Welches Muster begegnet dir in deinem Leben immer wieder?','Wiederholungs-Kompass'],
['RESET','Verantwortung','Was löst dieses Muster normalerweise aus?','Trigger-Kompass'],
['RESET','Verantwortung','Wie reagierst du dann automatisch?','Modus-Kompass'],
['RESET','Verantwortung','Was versuchst du mit dieser Reaktion möglicherweise zu schützen?','Trigger-Kompass'],
['RESET','Standards','Was wäre der Gegenpol zu deinem bisherigen Verhalten?','Gegenpol-Generator'],
['RESET','Disziplin','Was könntest du beim nächsten Auftauchen dieses Musters bewusst anders wählen?','RESET'],
['ORIENTIERUNG','Standards','Was möchtest du in deinen nächsten Lebensabschnitt nicht mehr mitnehmen?','Lebensphase'],
['ORIENTIERUNG','Vision','Wovon möchtest du stattdessen mehr in deinem Leben?','Werte-Kompass'],
['ORIENTIERUNG','Vision','Welche Menschen, Orte und Tätigkeiten lassen dich lebendig werden?','Was nährt dich?'],
['ORIENTIERUNG','Vision','Wie würde ein gewöhnlicher Tag aussehen, wenn dein Leben wirklich zu dir passen würde?','Lebensphase'],
['ORIENTIERUNG','Vision','Wer möchtest du in einem Jahr geworden sein?','Lebensaufgabe'],
['ORIENTIERUNG','Verantwortung','Wenn du dein Leben nicht länger nur geschehen lassen würdest – was möchtest du ab heute selbst gestalten?','Modus-Kompass / RESET']
];
const inter={5:['Du hast hingeschaut.','Du musst daraus noch nichts machen. Nimm es zunächst wahr.'],11:['Jetzt hast du nicht nur gedacht.','Du hast gespürt.'],17:['Erkenntnis bekommt Kraft,','wenn daraus eine Entscheidung entsteht.'],23:['Du bist deinem Muster begegnet.','Jetzt entsteht die Möglichkeit, neu zu wählen.']};
let S=JSON.parse(localStorage.getItem('ics30')||'null')||{i:0,a:Array(30).fill('').map(()=>({text:'',score:0,heart:false})),started:false};
const app=document.getElementById('app'); const save=()=>localStorage.setItem('ics30',JSON.stringify(S));
function start(){S.started=true;save();renderQ()}
function home(){let resume=S.started&&S.i<30;app.innerHTML=`<section class="card center"><div class="gold">PERSÖNLICHE STANDORTBESTIMMUNG</div><h1>30 FRAGEN<br>AN DICH</h1><h2 class="gold">Vom Funktionieren ins Gestalten.</h2><p>Vielleicht brauchst du gerade keine weitere Antwort.<br>Vielleicht brauchst du die richtige Frage.</p><p>30 Fragen führen dich durch <b>INNER · BODY · ACTION · RESET · ORIENTIERUNG</b> und zeigen dir, wo dein nächster Schritt beginnen könnte.</p><button class="btn" onclick="${resume?'renderQ()':'start()'}">${resume?'WEITERMACHEN – FRAGE '+(S.i+1):'MEINE STANDORTBESTIMMUNG STARTEN'}</button>${resume?'<button class="btn secondary" onclick="resetAll()">NEU BEGINNEN</button>':''}<p class="small">Ca. 15–25 Minuten · Speicherung nur lokal in diesem Browser · keine Diagnose</p></section>`}
function renderQ(){if(S.i>=30)return results();let q=qs[S.i],a=S.a[S.i];app.innerHTML=`<section class="card"><div class="meta"><b class="gold">${q[0]}</b><span>Frage ${S.i+1} von 30</span></div><div class="progress"><div style="width:${(S.i+1)/30*100}%"></div></div><div class="q">${q[2]}</div><textarea id="txt" placeholder="Deine Gedanken dazu …">${a.text}</textarea><p class="hint">Wie stark beschäftigt dich dieses Thema gerade?</p><div class="rating">${[1,2,3,4,5].map(n=>`<button class="rate ${a.score===n?'on':''}" onclick="rate(${n})">${n}</button>`).join('')}</div><div class="meta"><span>kaum</span><span>sehr stark</span></div><div class="heart ${a.heart?'on':''}" onclick="heart()">${a.heart?'♥':'♡'} Diese Frage möchte ich mir merken</div><div class="nav"><button class="btn secondary" onclick="back()">${S.i?'ZURÜCK':'START'}</button><button id="next" class="btn" ${a.score?'':'disabled'} onclick="next()">${S.i===29?'ABSCHLIESSEN':'WEITER'}</button></div></section>`;document.getElementById('txt').addEventListener('input',e=>{S.a[S.i].text=e.target.value;save()})}
function rate(n){S.a[S.i].score=n;save();renderQ()} function heart(){S.a[S.i].heart=!S.a[S.i].heart;save();renderQ()} function back(){if(S.i===0)return home();S.i--;save();renderQ()}
function next(){if(!S.a[S.i].score)return;let done=S.i;S.i++;save();if(inter[done])return pause(done);if(S.i>=30)return preResult();renderQ()}
function pause(done){let x=inter[done],nextWorld=qs[S.i][0];app.innerHTML=`<section class="card center"><div class="gold">${qs[done][0]} ✓</div><h2>${x[0]}</h2><p>${x[1]}</p><button class="btn" onclick="renderQ()">WEITER ZU ${nextWorld}</button></section>`}
function preResult(){app.innerHTML=`<section class="card center"><div class="gold">30 VON 30</div><h1>Deine Antworten<br>sind da.</h1><p>Jetzt verbinden wir die Punkte.</p><button class="btn" onclick="results()">MEINE STANDORTBESTIMMUNG ANZEIGEN</button></section>`}
function calc(){let W=Object.fromEntries(worlds.map(w=>[w,0])),K={Verantwortung:0,Disziplin:0,Vision:0,Standards:0},T={};qs.forEach((q,i)=>{let s=S.a[i].score||0;W[q[0]]+=s;K[q[1]]+=s;T[q[3]]=(T[q[3]]||0)+s});return{W,K,T}}
function results(){let {W,K,T}=calc(),wr=Object.entries(W).sort((a,b)=>b[1]-a[1]),kr=Object.entries(K).sort((a,b)=>b[1]-a[1]),tr=Object.entries(T).sort((a,b)=>b[1]-a[1]),hearts=S.a.map((a,i)=>a.heart?i:-1).filter(i=>i>=0);let top=wr[0][0],second=wr[1][0];let desc={INNER:'Deine Antworten richten die Aufmerksamkeit besonders auf innere Klarheit, Gedanken und das ehrliche Wahrnehmen dessen, was gerade da ist.',BODY:'Deine Antworten richten die Aufmerksamkeit besonders auf Körpersignale, Energie und das, was dich nährt oder Kraft kostet.',ACTION:'Deine Antworten richten die Aufmerksamkeit besonders auf Entscheidungen, Umsetzung und konkrete nächste Schritte.',RESET:'Deine Antworten richten die Aufmerksamkeit besonders auf wiederkehrende Muster und die Möglichkeit, bewusst neu zu wählen.',ORIENTIERUNG:'Deine Antworten richten die Aufmerksamkeit besonders auf Richtung, Lebensgestaltung und das, was künftig mehr Raum bekommen soll.'}[top];app.innerHTML=`<section class="card"><div class="center"><div class="gold">DEINE STANDORTBESTIMMUNG</div><h1>${top}</h1><p>${desc}</p></div><div class="worlds">${wr.map(([w,v])=>`<div class="barrow"><b>${w}</b><div class="bar"><i style="width:${v/30*100}%"></i></div><span>${Math.round(v/30*100)}%</span></div>`).join('')}</div><div class="resultbox"><div class="small">ZWEITER IMPULS</div><h2>${second}</h2><div class="small">ENTWICKLUNGSHEBEL</div><h2>${kr[0][0]}</h2></div>${hearts.length?`<div class="resultbox"><div class="gold">♥ WAS DICH BESONDERS BERÜHRT HAT</div>${hearts.map(i=>`<div class="path"><b>Frage ${i+1}</b><p>${qs[i][2]}</p>${S.a[i].text?`<div class="hint">Deine Antwort: ${esc(S.a[i].text)}</div>`:''}</div>`).join('')}</div>`:''}<div class="resultbox"><div class="gold">DEIN MÖGLICHER WEG</div>${tr.slice(0,3).map(([t],i)=>`<div class="path"><div class="small">0${i+1} · ${['ERKENNEN','VERTIEFEN','HANDELN'][i]}</div><h2>${t}</h2></div>`).join('')}<p class="small">Diese Auswertung ist eine persönliche Momentaufnahme und keine medizinische oder psychologische Diagnose.</p><button class="btn secondary" onclick="review()">MEINE ANTWORTEN ANSEHEN</button><button class="btn secondary" onclick="resetAll()">NEU BEGINNEN</button></div></section>`}
function review(){let html=S.a.map((a,i)=>`<div class="path"><b class="gold">${i+1} · ${qs[i][0]}</b><p><b>${qs[i][2]}</b></p><p>${a.text?esc(a.text):'<span class="hint">Keine Notiz</span>'}</p><span class="small">Intensität ${a.score}/5 ${a.heart?' · ♥ gemerkt':''}</span></div>`).join('');app.innerHTML=`<section class="card"><h2>Deine 30 Antworten</h2>${html}<button class="btn" onclick="results()">ZUR AUSWERTUNG</button></section>`}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))} function resetAll(){if(confirm('Alle Antworten wirklich löschen und neu beginnen?')){localStorage.removeItem('ics30');location.reload()}}
home();
</script></body></html>
